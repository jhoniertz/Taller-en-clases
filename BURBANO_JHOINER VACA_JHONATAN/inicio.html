<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agencia de Viajes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{padding-top:70px;}

.imagen-carrusel{height:500px;object-fit:cover;}

.card img{height:250px;object-fit:cover;}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
<div class="container">
<a class="navbar-brand" href="#">Agencia de Viajes</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
<li class="nav-item"><a class="nav-link" href="#destinos">Destinos</a></li>
<li class="nav-item"><a class="nav-link" href="formulario.html">Formulario</a></li>
</ul>
</div>
</div>
</nav>

<section id="inicio">
<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner">

<div class="carousel-item active">
<img src="imagen/image copy.png" class="d-block w-100 imagen-carrusel">
</div>

<div class="carousel-item">
<img src="imagen/image copy 2.png" class="d-block w-100 imagen-carrusel">
</div>

<div class="carousel-item">
<img src="imagen/iamgen3.png" class="d-block w-100 imagen-carrusel">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>
</section>

<section id="destinos" class="container mt-5">
<h2 class="text-center mb-4">Destinos</h2>

<div class="row">

<div class="col-md-4">
<div class="card mb-4">
<img src="imagen/image.png" class="card-img-top">

<div class="card-body">
<h5 class="card-title">Cartagena</h5>
<p class="card-text">Disfruta de playas y lugares turísticos.</p>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalViaje">
Ver más
</button>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card mb-4">
<img src="imagen/sanadres.png" class="card-img-top">

<div class="card-body">
<h5 class="card-title">San Andrés</h5>
<p class="card-text">Viaja y conoce el mar de siete colores.</p>
<button class="btn btn-primary">Comprar</button>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card mb-4">
<img src="imagen/cartajena.png" class="card-img-top">

<div class="card-body">
<h5 class="card-title">Santa Marta</h5>
<p class="card-text">Conoce hermosos paisajes y playas.</p>
<button class="btn btn-primary">Comprar</button>
</div>
</div>
</div>

</div>
</section>

<div class="modal fade" id="modalViaje">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Viaje a Cartagena</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
Incluye hospedaje, alimentación y recorridos turísticos.
</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">
Cerrar
</button>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
